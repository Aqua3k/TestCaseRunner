# tox.ini
[tox]
envlist = integration, mypy

[testenv]
deps = -r requirements.txt

; [testenv:unit]
; changedir = tests/unit_tests
; commands = pytest -v

[testenv:integration]
changedir = tests
commands = pytest -v

[testenv:integration-coverage]
changedir = tests
commands = 
    python run_pytest_with_coverage.py

[testenv:mypy]
commands = mypy src/testcaserunner/
